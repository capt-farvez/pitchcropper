# Pipeline configuration. Every key is required and validated at startup.
# An unknown key, a missing key, or a value out of range stops the run before any video is opened.

video_path: synthetic_pitch_feed.mp4
output_path: run_summary.json   # final result as JSON; null to skip
confidence_threshold: 0.5

sampling:
  analysis_fps: 2       # frames per second of video to inspect; the rest are skipped without analysis
  max_frames: null      # stop after this many inspected frames; null means the whole video
  downscale: 1          # shrink frames by this factor before detection; 1 keeps full resolution

field_detector:
  type: hsv_mask        # which detector implementation to use
  sport: football
  min_area: 1000        # smallest contour area in px^2 (at full resolution) accepted as a boundary
  max_coverage: 1.0     # largest share of the frame a boundary may cover; the placeholder detector returns
                        # the whole green frame, so 1.0 here. A real detector would sit nearer 0.9.

crop_search:
  aspect_ratio: "16:9"
  padding_px: 20

logging:
  level: INFO           # DEBUG logs every skipped frame and its reason
  format: text          # text for a person at a terminal, json for batch runs and log collectors
  progress_every: 50    # emit a progress record every N inspected frames

resilience:
  max_consecutive_frame_errors: 10   # a frame that fails to decode or detect is skipped; this many in a row stops the run
